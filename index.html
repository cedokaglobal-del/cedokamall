    <!-- ===== PERFORMANCE: Google Fonts (Inter) with display=swap ===== -->

    <!-- ===== INLINE CRITICAL CSS — prevents blank flash during JS hydration ===== -->
    <style>
      *,::before,::after{box-sizing:border-box}
      html{font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
      body{margin:0;background:#0f1117;color:#f0f0f0;min-height:100vh}
      #root{min-height:100vh}
      /* Page loader (matches React PageLoader component) */
      #initial-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1117;z-index:9999}
      #initial-loader div{width:40px;height:40px;border:3px solid #ff6b35;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- ===== STRUCTURED DATA: LocalBusiness ===== -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

  </head>

  <body>
    <!-- Initial loader — hidden by JS once React mounts -->
    <div id="initial-loader" aria-hidden="true">
      <div></div>
    </div>

    <div id="root"></div>

    <!-- Hide the native loader once React takes over -->
    <script>
      (function(){
        var r = document.getElementById('root');
        var l = document.getElementById('initial-loader');
        if (!r || !l) return;
        var obs = new MutationObserver(function(){
          if (r.children.length > 0) { l.style.display = 'none'; obs.disconnect(); }
        });
        obs.observe(r, { childList: true });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
