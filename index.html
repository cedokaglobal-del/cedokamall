<!doctype html>
<html lang="en">
  <head>
    <!-- Charset and Viewport -->
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Basic Meta Tags -->
    <title>Cedokamall — Nigeria's Premium Online Marketplace | Electronics, Appliances & More</title>
    <meta name="description" content="Shop 50,000+ premium products on Nigeria's trusted marketplace. Electronics, home appliances, smartphones, and more with lightning-fast Nationwide delivery. 1.2M+ happy customers." />
    <meta name="keywords" content="online shopping Nigeria, electronics Nigeria, home appliances Lagos, fast delivery Nigeria, Cedoka Mall, buy smartphones online Nigeria" />
    <meta name="author" content="Cedokamall" />
    <meta name="creator" content="Cedoka Global Limited" />
    <meta name="publisher" content="Cedoka Mall" />
    <meta name="language" content="en-NG" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Mobile & App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cedokamall" />
    <meta name="theme-color" content="#ff6b35" />
    <meta name="msapplication-TileColor" content="#ff6b35" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph Meta Tags (Social Sharing) -->
    <meta property="og:title" content="Cedokamall — Nigeria's Premium Online Marketplace" />
    <meta property="og:description" content="Shop 50,000+ products with fast Lagos delivery. Electronics, appliances, accessories & more. Trusted sellers, secure payments, 24-48hr delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cedokamall" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:image" content="https://cedokamall.com/og-image.jpg" />
    <meta property="og:url" content="https://cedokamall.com" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cedokamall — Nigeria's Premium Online Marketplace" />
    <meta name="twitter:description" content="Shop 50,000+ products with fast Lagos delivery. Electronics, appliances, accessories & more." />
    <meta name="twitter:creator" content="@cedokamall" />
    <meta name="twitter:image" content="https://cedokamall.com/og-image.jpg" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://cedokamall.com" />
    
    <!-- Alternate Links -->
    <link rel="alternate" hreflang="en-NG" href="https://cedokamall.com" />
    <link rel="alternate" hreflang="en" href="https://cedokamall.com" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    
    <!-- Security Headers -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' *.unsplash.com *.googleapis.com; style-src 'self' 'unsafe-inline' *.googleapis.com; img-src 'self' data: https: *.unsplash.com *.gstatic.com; font-src 'self' data: *.googleapis.com *.gstatic.com; connect-src 'self' ws: wss: *.unsplash.com *.googleapis.com; frame-ancestors 'none'; block-all-mixed-content" /> -->
    <!-- 
      Security headers like X-Frame-Options and X-XSS-Protection should be 
      set by the server instead of HTML meta tags. 
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="geolocation=(), microphone=(), camera=()" />

      "url": "https://cedokamall.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://cedokamall.com/shop?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
